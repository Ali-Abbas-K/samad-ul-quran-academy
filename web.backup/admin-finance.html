<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance | Samad-ul-Qur’an Academy</title><link rel="stylesheet" href="styles.css"></head><body class="portal-page"><header class="portal-header"><div class="container portal-nav"><a class="brand" href="admin.html"><img src="assets/logo.jpg"><span>SAMAD-UL-QUR’AN <small>FINANCE</small></span></a><a class="btn small secondary" href="admin.html">Admin Control Center</a></div></header><main class="dashboard"><div class="container"><section class="portal-hero"><div class="avatar">₨</div><div><span class="eyebrow">Finance dashboard</span><h1 style="margin:5px 0">Revenue & Payment Analytics</h1><p>Verified income is separated from pending, rejected and overdue records.</p></div></section><div class="dash-cards" id="financeCards"></div><div class="portal-grid"><div class="card"><h2>Revenue by payment method</h2><div id="methods"></div></div><div class="card"><h2>Revenue by course</h2><div id="courses"></div></div></div><div class="card" style="margin-top:20px"><h2>Payment ledger</h2><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Course</th><th>Month</th><th>Amount</th><th>Method</th><th>Status</th><th>Reference</th></tr></thead><tbody id="ledger"></tbody></table></div></div></div></main><script>(async()=>{const k=sessionStorage.getItem('adminKey');if(!k)return location.href='admin-login.html';try{const r=await fetch((window.SAMAD_API_BASE||(location.protocol==='file:'?'https://samad-ul-quran-academy-1.onrender.com/api':'/api'))+'/admin/finance',{headers:{'X-Admin-Key':k},cache:'no-store'}),o=await r.json();if(!r.ok)throw Error(o.error);const t=o.totals;document.getElementById('financeCards').innerHTML=[['Verified',t.verified],['Pending',t.pending],['Rejected',t.rejected],['Outstanding',t.outstanding]].map(x=>`<div class="card stat"><strong>PKR ${Number(x[1]).toLocaleString()}</strong><span>${x[0]}</span></div>`).join('');document.getElementById('methods').innerHTML=o.byMethod.map(x=>`<div class="notice"><strong>${x.method}</strong><span style="float:right">PKR ${Number(x.total).toLocaleString()}</span></div>`).join('')||'<div class="empty">No verified payments.</div>';document.getElementById('courses').innerHTML=o.byCourse.map(x=>`<div class="notice"><strong>${x.course}</strong><span style="float:right">PKR ${Number(x.total).toLocaleString()}</span></div>`).join('')||'<div class="empty">No verified payments.</div>';document.getElementById('ledger').innerHTML=o.payments.map(p=>`<tr><td>${p.student_name||''}</td><td>${p.course||''}</td><td>${p.billing_month||''}</td><td>PKR ${Number(p.amount).toLocaleString()}</td><td>${p.method}</td><td>${p.status}</td><td>${p.reference}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No payments.</td></tr>'}catch(e){document.body.insertAdjacentHTML('beforeend',`<p style="padding:30px">${e.message}</p>`)}})()</script></body></html>
