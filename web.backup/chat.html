<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | Samad-ul-Qur’an Academy</title><link rel="stylesheet" href="styles.css"></head><body class="portal-page"><header class="portal-header"><div class="container portal-nav"><a class="brand" href="student-dashboard.html"><img src="assets/logo.jpg"><span>SAMAD-UL-QUR’AN <small>MESSAGES</small></span></a><div class="portal-actions"><a class="btn small secondary" href="student-dashboard.html">Dashboard</a><a class="btn small" href="#" data-logout>Logout</a></div></div></header><main class="dashboard"><div class="container"><section class="portal-hero"><div class="avatar">✉</div><div><span class="eyebrow">Private communication</span><h1 style="margin:5px 0">Messages</h1><p>Communicate only with your assigned teacher or assigned students.</p></div></section><div class="portal-grid"><div class="card"><h2>Contacts</h2><div id="contacts"></div></div><div class="card"><h2 id="chatTitle">Select a contact</h2><div id="messages" style="min-height:320px"></div><form id="chatForm" style="display:flex;gap:10px;margin-top:15px"><input id="message" required maxlength="2000" placeholder="Write a message…"><button class="btn">Send</button></form></div></div></div></main><div id="toast" class="toast"></div><script src="script.js?v=20260914-2"></script><script>(async()=>{const u=user();if(!u||!token())return location.href=u?.role==='teacher'?'teacher-login.html':'student-login.html';const r=await api('/chat/contacts');let selected='';const contacts=document.getElementById('contacts');contacts.innerHTML=r.contacts.length?r.contacts.map(c=>`<button class="btn secondary" style="width:100%;margin:5px 0;text-align:left" onclick="choose('${encodeURIComponent(c.email)}','${esc(c.name)}')">${esc(c.name)}<br><small>${esc(c.email)}</small></button>`).join(''):'<div class="empty">No permitted contacts yet.</div>';window.choose=async(email,name)=>{selected=decodeURIComponent(email);document.getElementById('chatTitle').textContent=name;const o=await api('/chat?with='+encodeURIComponent(selected));document.getElementById('messages').innerHTML=o.messages.length?o.messages.map(m=>`<div class="notice"><strong>${esc(m.sender_role)}</strong><p>${esc(m.message)}</p><small>${esc(m.created_at)}</small></div>`).join(''):'<div class="empty">No messages yet.</div>'};document.getElementById('chatForm').onsubmit=async e=>{e.preventDefault();if(!selected)return toast('Select a contact first');try{await api('/chat',{method:'POST',body:JSON.stringify({with:selected,message:document.getElementById('message').value})});document.getElementById('message').value='';await choose(encodeURIComponent(selected),document.getElementById('chatTitle').textContent)}catch(x){toast(x.message)}}})()</script></body></html>
