org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Choose ONE of the two shipping modes below.
#
# MODE 1 - ONLINE (recommended)
#   Point the app at the live website. Site and API share an origin, so login,
#   fee proof uploads and the Jitsi classroom behave exactly as in a mobile
#   browser, and website updates reach users without a new APK.
#   Replace the placeholder below with your real HTTPS domain:
SAMAD_WEB_URL=https://YOUR-SAMAD-DOMAIN.example
#
# MODE 2 - BUNDLED
#   Ship the copy of the site in app/src/main/assets/site (refresh it with
#   `bash tools/sync-android.sh` after every website build) and point it at a
#   remote API. To use this mode:
#     a) leave SAMAD_WEB_URL as the placeholder above,
#     b) uncomment and set the line below,
#     c) add https://appassets.androidplatform.net to ALLOWED_ORIGINS in
#        server/.env, because the bundled pages are a different origin to the API.
# SAMAD_API_BASE_URL=https://YOUR-SAMAD-DOMAIN.example/api
#
# The app refuses cleartext HTTP (usesCleartextTraffic="false" in the manifest),
# so both values must be https://.
# ---------------------------------------------------------------------------
